# Arwun field data-collection parameters.
#
# NOTE ON TOPIC NAMES: realsense2_camera has changed its topic namespacing and
# its profile parameter names across releases. The names below target the
# 4.5x series launched with camera_name:=camera and an empty namespace. Before
# your first real collection, plug the D435i in, run the launch, and check:
#
#     ros2 topic list | grep camera
#
# then reconcile `record_controller.topics` below with what actually appears.
# `ros2 bag record` does NOT error on a topic name that never publishes -- it
# records the ones it finds and silently omits the rest, so a typo here shows
# up only as a missing topic in `ros2 bag info` after the fact. Check the
# first bag of any session before trusting the rest.

camera:
  ros__parameters:
    # --- streams ---
    enable_color: true
    enable_depth: true
    # The IR stereo pair is recorded even though nothing consumes it today.
    # Calibration, extrinsics and noise models can all be worked out after a
    # collection run; a stream that was never recorded cannot. These are the
    # frames any future VIO or offline-stereo work would actually want, because
    # they are GLOBAL SHUTTER -- the color stream is rolling shutter, which
    # injects pose-dependent distortion that VIO front-ends handle badly.
    #
    # Costs, measured 2026-08-14: +30% disk (see the recorder section below)
    # and no measurable CPU change (66% of one core against 67% without them,
    # inside run-to-run noise). USB is untroubled.
    #
    # THE IR IMAGES CARRY THE PROJECTOR'S DOT PATTERN as configured. The dots
    # are what make depth work on untextured surfaces, and they wreck feature
    # tracking for VIO. Three ways to sit with this, none free:
    #   - as-is: depth is at its best, the IR pair is compromised for VIO.
    #   - depth_module.emitter_enabled: 0 -- clean IR, worse depth indoors and
    #     on blank surfaces. Outdoors in daylight the projector contributes
    #     little anyway, so this costs less in the field than it sounds.
    #   - depth_module.emitter_on_off: true -- alternates per frame, so you get
    #     both at half rate each, and downstream has to sort the frames out.
    # Left as-is deliberately: depth is the validated product today and VIO is
    # not yet in the loop. Revisit before a collection run intended for VIO.
    enable_infra1: true
    enable_infra2: true

    # Resolution / fps. "width,height,fps".
    #
    # Measured 2026-08-12 on this rig over a real USB 3 link (5 Gbps, driver
    # reports "Device USB type: 3.2"), align_depth on, 15s per profile:
    #
    #   profile                     color  depth  aligned  imu    node CPU
    #   640x480x30                   28.8   28.5    29.2   199.9    67%
    #   848x480x30                   28.2   28.3    28.8   200.1    71%
    #   1280x720x30                  27.5   26.8    28.9   200.0    99%
    #   640x480x60                   55.5   55.1    57.3   199.9    84%
    #   1920x1080 color + 720 depth  21.5   28.4    21.7   196.5   125%
    #
    # CPU is percent of ONE core (6 available). Rates are ~4% pessimistic:
    # the four concurrent `ros2 topic hz` subscribers used to measure them cost
    # about that much themselves (28.999 with one subscriber vs 27.747 with
    # four, same profile). No driver-reported frame drops or USB errors at any
    # profile except the 1080p one.
    #
    # THE LIMIT IS CPU, NOT BUS BANDWIDTH. An earlier version of this comment
    # claimed 1280x720x30 on both streams "will saturate the bus and start
    # dropping frames". That was measured while the rig was on a USB 2 cable,
    # where it was true (720p color+depth needs ~884 Mbps against 480 Mbps
    # available). On USB 3 it streams clean. What actually binds is
    # align_depth, which is CPU-side and roughly doubles node CPU:
    #
    #   640x480x30    26% without align -> 67% with
    #   1280x720x30   51% without align -> 99% with   <-- one core pegged
    #
    # so 1280x720x30 works but has no headroom left for anything else on that
    # core. 848x480x30 is the better upgrade from 640x480: it is the D435i's
    # native depth resolution, costs only 4 points of CPU over VGA, and leaves
    # room. 1920x1080 color is genuinely over budget -- 21.5 Hz against a
    # requested 30, and the first profile where the IMU itself starts slipping
    # (196.5 Hz rather than 200).
    #
    # If you need more than this, the lever is CUDA: scripts/build_librealsense.sh
    # currently passes -DBUILD_WITH_CUDA=false, so alignment runs on the CPU of
    # a machine that has an idle GPU. Turning that on is untested here.
    rgb_camera.color_profile: "640,480,30"
    depth_module.depth_profile: "640,480,30"
    # KEEP THIS EQUAL TO depth_profile. Depth and both IR streams come off the
    # same sensor, and mismatched resolutions do not fail loudly: with infra
    # left at its 848x480 default against depth at 640x480, the node logs every
    # stream opening normally, /camera/infra1 and /camera/infra2 publish at a
    # healthy 30 Hz -- and /camera/depth and /camera/aligned_depth_to_color go
    # completely silent. Nothing in the log says so. Observed 2026-08-14 while
    # enabling the IR pair; caught only by checking topic rates afterwards.
    # If you change depth_profile, change this with it and re-check that depth
    # still publishes.
    depth_module.infra_profile: "640,480,30"

    # --- IMU (D435i) ---
    # REQUIRES the source-built librealsense (scripts/build_librealsense.sh).
    # This Jetson kernel has no hid_sensor_* modules, so the apt build
    # enumerates no Motion Module and these two flags silently do nothing --
    # color and depth still stream, so the rig looks healthy. record.launch.py
    # points the driver at the RSUSB build and warns if it is missing.
    #
    # Verified 2026-08-09: /camera/imu publishes at 200 Hz (gyro-rate, since
    # unite_imu_method 2 interpolates accel up to the gyro timestamps).
    #
    # CALIBRATION: a calibration WAS run and written to the camera's EEPROM on
    # 2026-08-12 (scripts/calibrate_imu.sh; the fit is committed as
    # calibration.json at the workspace root). It is not finished. Measured
    # 2026-08-14 with scripts/check_imu_bias.py over 6000 stationary samples:
    #
    #   accelerometer  10.117 +/- 0.011 m/s^2  -- +3.2%, was 8.949 (-8.8%)
    #   gyroscope      residual bias 66-123% of the fitted value, i.e. the
    #                  gyro bias correction is not being applied at all
    #
    # So the accel fit overcorrects (probably freehand poses during the
    # procedure, whose tilt the fit absorbs into scale and alignment), and the
    # gyro half never took effect for an upstream reason -- the device holds a
    # bias smaller than what was written by almost exactly 180/pi, the
    # signature of a deg/s-vs-rad/s mismatch. README.md has the full account.
    #
    # WHAT THIS MEANS FOR RECORDING: bags are still worth collecting, but they
    # are no longer raw. librealsense applies the EEPROM intrinsics inside the
    # sensor, so /camera/imu carries whatever calibration was live at the time.
    # That is invertible in post only if you know WHICH calibration was live,
    # so either settle the calibration before a real collection or note the
    # active fit alongside the bags. Re-running calibrate_imu.sh just
    # overwrites the EEPROM again -- there is nothing to lose by retrying, and
    # check_imu_bias.py verifies the result in 30s.
    #
    # Not a blocker for VIO/SLAM on its own: estimators carry gyro bias as an
    # online state. Accelerometer SCALE error is the more awkward half, since
    # they model accel bias but generally not accel scale.
    enable_gyro: true
    enable_accel: true
    # 2 = linear_interpolation, which merges gyro+accel into a single
    # /camera/imu topic. With unite_imu_method:=0 you get separate
    # /camera/gyro/sample and /camera/accel/sample instead, and the topic
    # list below must change to match.
    unite_imu_method: 2

    # --- derived ---
    align_depth.enable: true
    enable_sync: true

    # --- frames ---
    publish_tf: true
    tf_publish_rate: 0.0   # 0.0 = static transforms only, published once

    # Power-cycles the sensor on start. Costs ~2s of startup but avoids the
    # "frames didn't arrive" failure after an unclean shutdown, which is the
    # common failure mode when you kill a launch in the field.
    initial_reset: true

joy_linux:
  ros__parameters:
    dev: "/dev/input/js0"
    deadzone: 0.05
    # Republish the last state at this rate even when nothing changes, so the
    # recorder still sees button state if a BT packet is dropped.
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

record_controller:
  ros__parameters:
    output_dir: "~/arwun_bags"
    bag_prefix: "arwun"
    # mcap over sqlite3: self-describing (schemas travel in the file), and
    # readable by Foxglove/rerun without a ROS install. Requires
    # ros-humble-rosbag2-storage-mcap, which is NOT pulled in by rosbag2 --
    # without it `ros2 bag record --storage mcap` fails at startup.
    storage_id: "mcap"

    # Probed live from the 8BitDo (Switch/Pro Controller mode) on
    # /dev/input/js0 -- the device reports 16 buttons, 6 axes.
    toggle_button: 7
    debounce_sec: 0.4

    # Extra flags passed through to `ros2 bag record`. Splitting bags keeps a
    # single corrupt file from costing you a whole collection run.
    #
    # DISK IS THE BINDING CONSTRAINT IN THE FIELD, not CPU or USB. A measured
    # 310s run at 640x480x30 produced 18.5 GiB -- about 61 MB/s sustained, or
    # ~215 GiB per hour, and that was BEFORE the IR pair was recorded. With
    # infra1+infra2 the payload measured 79 MB/s, or ~266 GiB per hour
    # (2026-08-14, 20s window).
    #
    # This rig's disk is 233 GB total and had 144 GB free when that was
    # measured, which is about 32 MINUTES of continuous recording. Check free
    # space before every session, plan on offloading between runs, and treat
    # external media as a prerequisite for a real field day rather than an
    # upgrade. If you need the endurance more than the IR pair, turning
    # enable_infra1/2 back off buys back roughly a quarter of the bandwidth.
    #
    # That run also showed /camera/color/image_raw arriving 176 frames short of
    # its own /camera/color/camera_info over the same interval (9106 vs 9282,
    # ~1.9%). Both are published per frame by the driver, so the shortfall is
    # rosbag2 dropping the large message under write load while the small one
    # gets through -- not the camera dropping frames. If that 1.9% matters for
    # your use, the lever is write throughput, not the camera settings.
    extra_record_args: ["--max-bag-size", "2000000000"]

    topics:
      - "/camera/color/image_raw"
      - "/camera/color/camera_info"
      - "/camera/depth/image_rect_raw"
      - "/camera/depth/camera_info"
      - "/camera/aligned_depth_to_color/image_raw"
      - "/camera/aligned_depth_to_color/camera_info"
      # Global-shutter IR pair, with their own camera_info and the extrinsics
      # that place them against depth -- all four are needed to do anything
      # with the stereo pair offline. Verified publishing 2026-08-14 at
      # 29.4 Hz each. /camera/aligned_depth_to_infra1 exists as a topic but
      # never publishes (align_depth targets color only), so it is not listed.
      - "/camera/infra1/image_rect_raw"
      - "/camera/infra1/camera_info"
      - "/camera/infra2/image_rect_raw"
      - "/camera/infra2/camera_info"
      - "/camera/extrinsics/depth_to_infra1"
      - "/camera/extrinsics/depth_to_infra2"
      - "/camera/imu"
      - "/camera/extrinsics/depth_to_color"
      - "/joy"
      - "/arwun/recording_status"
      # /tf is listed ahead of need: arwun_description is still a scaffold with
      # no URDF, and even once one lands it will be all-fixed, so
      # robot_state_publisher will emit the whole tree on /tf_static and never
      # touch /tf. Expect /tf to be absent from `ros2 bag info` until the rig
      # grows actuated joints and a joint_state_publisher. /tf_static IS
      # populated today -- the camera node publishes its own optical frames.
      - "/tf"
      - "/tf_static"
